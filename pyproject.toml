[project]
name = "eia-chat"
version = "0.2.0"
description = "Multi-channel chat gateway with conversation memory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx==0.25.2",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "groq>=0.5.0",
    "pyjwt>=2.12.1",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.27",
    "asyncpg>=0.29.0",
]

[project.scripts]
dev = "app.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
